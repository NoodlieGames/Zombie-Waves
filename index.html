<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Waves</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Roboto', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #gameCanvas { display: block; }

        /* UI LAYOUT */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            font-weight: bold;
        }

        .hud-col { display: flex; flex-direction: column; gap: 5px; }
        .score-box span { color: #ffd700; }
        .wave-box span { color: #ff4444; }
        .ammo-box { color: #00e5ff; margin-top: 5px; font-size: 18px; }

        /* Boss Bar */
        #boss-ui {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 500px;
            text-align: center;
            transition: opacity 0.5s;
        }
        #boss-name { font-family: 'Creepster', cursive; color: #ff0000; font-size: 24px; text-shadow: 0 0 10px #000; margin-bottom: 5px; }
        #boss-bar-container { height: 12px; background: #222; border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
        #boss-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #990000); transition: width 0.1s; }

        /* SCREENS */
        #start-screen, #game-over-screen, #shop-screen, #lobby-screen, #mode-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: auto;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 60px;
            color: #bd0000;
            margin: 10px 0;
            text-shadow: 0 0 15px #500000;
            text-align: center;
            line-height: 1;
        }

        .coin-display {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .coin-icon {
            width: 24px;
            height: 24px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #b7950b;
            display: inline-block;
        }

        .btn {
            background: #bd0000;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 22px;
            font-family: 'Creepster', cursive;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #600000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px;
        }
        .btn:hover { background: #ff1a1a; transform: scale(1.05); }
        .btn:active { transform: scale(0.95); box-shadow: 0 2px 0 #600000; }
        .btn-shop { background: #e67e22; box-shadow: 0 4px 0 #a04000; }
        .btn-back { background: #7f8c8d; box-shadow: 0 4px 0 #2c3e50; font-size: 18px; padding: 10px 20px;}
        
        .hidden { display: none !important; }

        #health-bar-container {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        #health-bar-fill { width: 100%; height: 100%; background: #00ff00; transition: width 0.2s; }

        /* SELECTORS */
        .selector-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .selector-box {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .selector-controls { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .arrow-btn { background: #444; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .item-label { color: #aaa; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .item-name { color: #ffd700; font-family: 'Creepster', cursive; font-size: 18px; letter-spacing: 1px; }

        /* SHOP GRID */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 600px; margin-bottom: 20px; padding: 10px; }
        .shop-item { background: #2c3e50; padding: 15px; border-radius: 8px; border: 2px solid #34495e; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .shop-item h3 { margin: 0 0 5px 0; color: #3498db; }
        .cost { color: #ffd700; font-weight: bold; margin-bottom: 5px; }
        .buy-btn { background: #27ae60; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .buy-btn:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.7; }
        .owned-badge { background: #8e44ad; color: white; padding: 8px; border-radius: 4px; font-weight: bold; }

        /* LOBBY */
        .lobby-info { background: #333; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; width: 80%; max-width: 400px; }
        .lobby-link { background: #222; padding: 10px; margin-top: 10px; border-radius: 5px; font-family: monospace; user-select: all; cursor: pointer; color: #00e5ff; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: opacity 0.5s; pointer-events: none; }

        .player-label {
            position: absolute;
            color: white;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
            white-space: nowrap;
            transform: translate(-50%, -40px);
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-col">
                <div class="score-box">SCORE: <span id="scoreDisplay">0</span></div>
                <div class="score-box">COINS: <span id="hudCoinsDisplay">0</span></div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <div class="wave-box">WAVE <span id="waveDisplay">1</span></div>
                <div id="health-bar-container"><div id="health-bar-fill"></div></div>
                <div class="ammo-box" id="ammoDisplay">∞ / ∞</div>
            </div>
        </div>

        <div id="boss-ui" class="hidden">
            <div id="boss-name">THE ABOMINATION</div>
            <div id="boss-bar-container"><div id="boss-bar-fill"></div></div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>ZOMBIE WAVES</h1>
        <div class="coin-display"><div class="coin-icon"></div> <span id="menuCoinDisplay">0</span></div>
        <div class="selector-container">
            <div class="selector-box">
                <div class="item-label">Skin</div>
                <canvas id="skinPreviewCanvas" width="60" height="60"></canvas>
                <div class="item-name" id="skinName">Rookie</div>
                <div class="selector-controls">
                    <button class="arrow-btn" id="prevSkin">&lt;</button>
                    <button class="arrow-btn" id="nextSkin">&gt;</button>
                </div>
            </div>
            <div class="selector-box">
                <div class="item-label">Weapon</div>
                <div style="height:60px; display:flex; align-items:center; justify-content:center; font-size:30px;">🔫</div>
                <div class="item-name" id="weaponName">Pistol</div>
                <div class="selector-controls">
                    <button class="arrow-btn" id="prevWeapon">&lt;</button>
                    <button class="arrow-btn" id="nextWeapon">&gt;</button>
                </div>
            </div>
        </div>
        <div>
            <button class="btn" onclick="openModeSelect()">PLAY</button>
            <button class="btn btn-shop" id="openShopBtn">SHOP</button>
        </div>
    </div>

    <!-- MODE SELECT -->
    <div id="mode-screen" class="hidden">
        <h1>CHOOSE MODE</h1>
        <button class="btn" onclick="initSinglePlayer()">SINGLE PLAYER</button>
        <button class="btn" style="background:#2980b9" onclick="createMultiplayerRoom()">CREATE ROOM</button>
        <button class="btn btn-back" onclick="showScreen('start-screen')">BACK</button>
    </div>

    <!-- LOBBY -->
    <div id="lobby-screen" class="hidden">
        <h1>LOBBY</h1>
        <div class="lobby-info">
            <p>Waiting for players...</p>
            <div class="lobby-link" id="inviteLink" onclick="copyInvite()">Click to Copy Invite Link</div>
        </div>
        <div id="lobby-player-list" style="margin-bottom:20px;"></div>
        <button class="btn hidden" id="hostStartBtn" onclick="hostStartGame()">START GAME</button>
        <button class="btn btn-back" onclick="location.reload()">LEAVE</button>
    </div>

    <!-- SHOP -->
    <div id="shop-screen" class="hidden">
        <h1>ARMORY</h1>
        <div class="coin-display"><div class="coin-icon"></div> <span id="shopCoinDisplay">0</span></div>
        <div class="shop-grid" id="shopGrid"></div>
        <button class="btn btn-back" id="closeShopBtn">BACK</button>
    </div>

    <!-- GAME OVER -->
    <div id="game-over-screen" class="hidden">
        <h1>YOU DIED</h1>
        <p>The horde consumed you.</p>
        <p>Score: <span id="finalScore" style="color: #ffd700;">0</span></p>
        <p>Coins Earned: <span id="earnedCoins" style="color: #ffd700;">0</span></p>
        <button class="btn" id="restartBtn">MENU</button>
    </div>

    <div id="toast" class="toast">Link Copied!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, getDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'zombie-waves-boss';

        // --- AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx, mainOsc, mainGain, musicInterval;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let step = 0;
            const sequence = [110, 123, 130, 146, 110, 123, 164, 146];
            musicInterval = setInterval(() => {
                if (!gameRunning) return;
                const baseFreq = sequence[step % sequence.length];
                const multiplier = bossActive ? 1.5 : 1.0;
                playSound(baseFreq * multiplier, 'sawtooth', 0.2, 0.05);
                if (step % 4 === 0) playSound(60, 'sine', 0.1, 0.2);
                step++;
            }, 250);
        }

        // --- GAME CONSTANTS ---
        const WEAPONS = {
            pistol: { name: 'Pistol', damage: 1, rate: 0.4, spread: 0.05, speed: 800, count: 1, color: '#ffeb3b', ammo: Infinity, automatic: false },
            smg:    { name: 'SMG',    damage: 0.8, rate: 0.1, spread: 0.15, speed: 900, count: 1, color: '#00e5ff', ammo: 150, automatic: true },
            shotgun:{ name: 'Shotgun',damage: 1, rate: 0.8, spread: 0.3,  speed: 700, count: 5, color: '#ff5722', ammo: 30, automatic: false }
        };

        const SHOP_ITEMS = [
            { id: 'hp_up', type: 'upgrade', name: 'Max Health +20', cost: 150, maxLevel: 5, upgradeKey: 'hp' },
            { id: 'spd_up', type: 'upgrade', name: 'Speed +5%', cost: 200, maxLevel: 5, upgradeKey: 'speed' },
            { id: 'smg', type: 'weapon', name: 'Unlock SMG', cost: 800, weaponId: 'smg' },
            { id: 'shotgun', type: 'weapon', name: 'Unlock Shotgun', cost: 1500, weaponId: 'shotgun' }
        ];

        const SKINS = [
            { id: 'rookie', name: 'Rookie', color: '#3498db' },
            { id: 'hitman', name: 'Hitman', color: '#2c3e50' },
            { id: 'hazmat', name: 'Hazmat', color: '#f1c40f' },
            { id: 'cyborg', name: 'Cyborg', color: '#bdc3c7' }
        ];

        // --- GAME STATE ---
        let gameData = JSON.parse(localStorage.getItem('zombieWavesData')) || { coins: 0, inventory: ['pistol'], upgrades: { hp: 0, speed: 0 } };
        let user = null;
        let isMultiplayer = false;
        let isHost = true; // Default true for single player
        let currentRoomId = null;
        let networkPlayers = {};
        let lastNetUpdate = 0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const shopScreen = document.getElementById('shop-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const modeScreen = document.getElementById('mode-screen');
        const bossUI = document.getElementById('boss-ui');
        const bossBarFill = document.getElementById('boss-bar-fill');
        const bossNameDisplay = document.getElementById('boss-name');

        let gameRunning = false, animationId, lastTime = 0, score = 0, coinsCollectedInRun = 0, wave = 1;
        let zombiesSpawned = 0, zombiesToSpawn = 0, spawnTimer = 0, spawnRate = 1000, bossActive = false;

        const keys = { w: false, a: false, s: false, d: false };
        const mouse = { x: 0, y: 0, down: false };
        const touches = { leftId: null, rightId: null, leftVec: {x:0,y:0}, rightVec: {x:0,y:0} };

        let player = { x: 0, y: 0, r: 15, baseSpeed: 250, hp: 100, maxHp: 100, weapon: 'pistol', ammo: Infinity, skin: 'rookie', cooldown: 0 };
        let bullets = [], zombies = [], particles = [], loot = [], enemyBullets = [], camera = { x: 0, y: 0 };
        let selectedSkinIdx = 0, selectedWeaponIdx = 0;

        // --- AUTH & NETWORK ---
        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, u => {
                user = u;
                if(user) checkUrlInvite();
            });
        }

        window.showScreen = (id) => {
            [startScreen, gameOverScreen, shopScreen, lobbyScreen, modeScreen].forEach(s => s.classList.add('hidden'));
            const target = document.getElementById(id);
            if (target) target.classList.remove('hidden');
        }

        window.openModeSelect = () => window.showScreen('mode-screen');

        window.initSinglePlayer = () => {
            isMultiplayer = false;
            isHost = true;
            [startScreen, gameOverScreen, shopScreen, lobbyScreen, modeScreen].forEach(s => s.classList.add('hidden'));
            initGame();
        };

        window.createMultiplayerRoom = async () => {
            if (!user) return;
            const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoomId = roomId;
            isHost = true;
            isMultiplayer = true;

            const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            await setDoc(roomDoc, {
                status: 'lobby', host: user.uid, players: [user.uid], wave: 1
            });

            setupRoomListeners(roomId);
            document.getElementById('inviteLink').innerText = `${location.origin}${location.pathname}?room=${roomId}`;
            window.showScreen('lobby-screen');
            document.getElementById('hostStartBtn').classList.remove('hidden');
        };

        window.hostStartGame = async () => {
            if(!isHost) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId), { status: 'playing' });
        };

        window.copyInvite = () => {
            const text = document.getElementById('inviteLink').innerText;
            navigator.clipboard.writeText(text);
            const t = document.getElementById('toast');
            t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2000);
        };

        async function checkUrlInvite() {
            const params = new URLSearchParams(location.search);
            const roomId = params.get('room');
            if(roomId && user) {
                currentRoomId = roomId;
                isHost = false;
                isMultiplayer = true;
                
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const snap = await getDoc(roomDoc);
                if(snap.exists()) {
                    await updateDoc(roomDoc, { players: arrayUnion(user.uid) });
                    setupRoomListeners(roomId);
                    window.showScreen('lobby-screen');
                }
            }
        }

        function setupRoomListeners(roomId) {
            const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'players');
            const worldDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'world', 'state');

            onSnapshot(roomDoc, snap => {
                if(!snap.exists()) return;
                const data = snap.data();
                if(data.status === 'playing' && !gameRunning) {
                    window.showScreen('hidden');
                    initGame();
                }
            });

            onSnapshot(playersCol, snap => {
                const list = document.getElementById('lobby-player-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const pData = d.data();
                    if(d.id !== user.uid) networkPlayers[d.id] = pData;
                    list.innerHTML += `<div style="color:white; margin:5px;">Player ${d.id.substring(0,4)}</div>`;
                });
            });

            const myPlayerDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'players', user.uid);
            setDoc(myPlayerDoc, { x: 0, y: 0, skin: SKINS[selectedSkinIdx].id, hp: 100 });

            if(isHost) {
                setDoc(worldDoc, { zombies: [], loot: [], wave: 1 });
            } else {
                onSnapshot(worldDoc, snap => {
                    if(snap.exists()) {
                        const data = snap.data();
                        zombies = data.zombies || [];
                        loot = data.loot || [];
                    }
                });
            }
        }

        function syncNetwork() {
            if(!isMultiplayer || !user || !currentRoomId) return;
            const now = Date.now();
            if(now - lastNetUpdate < 50) return;
            lastNetUpdate = now;

            const myDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players', user.uid);
            updateDoc(myDoc, {
                x: player.x, y: player.y, 
                angle: Math.atan2(mouse.y + camera.y - player.y, mouse.x + camera.x - player.x),
                hp: player.hp,
                skin: SKINS[selectedSkinIdx].id
            }).catch(()=>{});

            if(isHost) {
                const worldDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'world', 'state');
                updateDoc(worldDoc, {
                    zombies: zombies.map(z => ({x:Math.round(z.x), y:Math.round(z.y), type:z.type, hp:z.hp, maxHp:z.maxHp, radius:z.radius})),
                    loot: loot.map(l => ({x:Math.round(l.x), y:Math.round(l.y), type:l.type, val:l.val})),
                    wave: wave
                }).catch(()=>{});
            }
        }

        // --- GAME LOGIC ---
        function initGame() {
            initAudio();
            const hpBonus = gameData.upgrades.hp * 20;
            const spdBonus = gameData.upgrades.speed * 0.05;
            player.maxHp = 100 + hpBonus;
            player.hp = player.maxHp;
            player.baseSpeed = 250 * (1 + spdBonus);
            player.x = canvas.width/2; player.y = canvas.height/2;
            player.skin = SKINS[selectedSkinIdx].id;
            const startWeaponId = gameData.inventory[selectedWeaponIdx];
            player.weapon = startWeaponId;
            player.ammo = WEAPONS[startWeaponId].ammo;
            score = 0; coinsCollectedInRun = 0; wave = 1; bossActive = false;
            bullets = []; zombies = []; particles = []; loot = []; enemyBullets = [];
            
            if(isHost) startWave();
            
            updateHUD();
            gameRunning = true; lastTime = performance.now(); requestAnimationFrame(gameLoop);
            startMusic();
        }

        function startWave() {
            zombiesSpawned = 0;
            bossActive = (wave % 5 === 0);
            
            if (bossActive) {
                zombiesToSpawn = 1;
                bossUI.classList.remove('hidden');
                bossNameDisplay.innerText = wave === 5 ? "THE CRUSHER" : wave === 10 ? "PLAGUE MOTHER" : "BLOOD OVERLORD";
            } else {
                zombiesToSpawn = 5 + Math.floor(wave * 2.5);
                bossUI.classList.add('hidden');
            }
            spawnRate = bossActive ? 2000 : Math.max(200, 1000 - (wave * 50)); 
            updateHUD();
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        
        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('hudCoinsDisplay').innerText = coinsCollectedInRun;
            document.getElementById('waveDisplay').innerText = wave;
            document.getElementById('ammoDisplay').innerText = player.ammo === Infinity ? '∞' : player.ammo;
            document.getElementById('health-bar-fill').style.width = (player.hp/player.maxHp)*100 + '%';
        }
        
        function saveData() { 
            gameData.coins += coinsCollectedInRun;
            localStorage.setItem('zombieWavesData', JSON.stringify(gameData)); 
            updateUI(); 
        }
        
        // --- UPDATE LOOP ---
        function update(dt) {
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1; if (keys.s) dy += 1;
            if (keys.a) dx -= 1; if (keys.d) dx += 1;
            if (touches.leftId !== null) { dx = touches.leftVec.x; dy = touches.leftVec.y; }
            if (dx !== 0 || dy !== 0) {
                if(touches.leftId === null) { const len = Math.sqrt(dx*dx + dy*dy); dx /= len; dy /= len; }
                player.x += dx * player.baseSpeed * dt; player.y += dy * player.baseSpeed * dt;
            }
            camera.x = player.x - canvas.width/2; camera.y = player.y - canvas.height/2;

            player.cooldown -= dt;
            let shootX = 0, shootY = 0, shooting = false;
            if (mouse.down) {
                const angle = Math.atan2(mouse.y + camera.y - player.y, mouse.x + camera.x - player.x);
                shootX = Math.cos(angle); shootY = Math.sin(angle); shooting = true;
            } else if (touches.rightId !== null && (Math.abs(touches.rightVec.x) > 0.1 || Math.abs(touches.rightVec.y) > 0.1)) {
                shootX = touches.rightVec.x; shootY = touches.rightVec.y;
                const len = Math.sqrt(shootX*shootX + shootY*shootY); shootX/=len; shootY/=len; shooting = true;
            }

            const wData = WEAPONS[player.weapon];
            if (shooting && player.cooldown <= 0) {
                playSound(400 + Math.random()*200, 'square', 0.05, 0.05);
                for(let i=0; i<wData.count; i++) {
                    const spread = (Math.random() - 0.5) * wData.spread;
                    const angle = Math.atan2(shootY, shootX) + spread;
                    bullets.push({ x: player.x + Math.cos(angle) * player.r * 1.5, y: player.y + Math.sin(angle) * player.r * 1.5, vx: Math.cos(angle) * wData.speed, vy: Math.sin(angle) * wData.speed, damage: wData.damage, life: 1.5 });
                }
                player.cooldown = wData.rate;
                if (wData.ammo !== Infinity) {
                    player.ammo--;
                    if (player.ammo <= 0) { player.weapon = 'pistol'; player.ammo = Infinity; }
                }
                updateHUD();
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
                if (b.life <= 0) bullets.splice(i, 1);
            }

            // --- LOOT PICKUP ---
            for (let i = loot.length - 1; i >= 0; i--) {
                let l = loot[i];
                let dist = Math.hypot(player.x - l.x, player.y - l.y);
                if (dist < player.r + 20) {
                    if (l.type === 'coin') {
                        coinsCollectedInRun += l.val;
                        playSound(800 + Math.random()*200, 'sine', 0.1, 0.1);
                        createParticles(l.x, l.y, '#ffd700', 8);
                    }
                    loot.splice(i, 1);
                    updateHUD();
                }
            }

            if(isHost) {
                spawnTimer += dt * 1000;
                if (spawnTimer > spawnRate && zombiesSpawned < zombiesToSpawn) {
                    spawnZombie(bossActive);
                    zombiesSpawned++;
                    spawnTimer = 0;
                }

                if (zombiesSpawned >= zombiesToSpawn && zombies.length === 0) {
                    wave++; startWave(); player.hp = Math.min(player.maxHp, player.hp + 20); updateHUD();
                }

                for (let i = zombies.length - 1; i >= 0; i--) {
                    let z = zombies[i];
                    if (z.type === 'boss' && !z.spawnedMinions && z.hp < z.maxHp * 0.5) {
                        z.spawnedMinions = true;
                        playSound(100, 'sawtooth', 1.0, 0.3); createParticles(z.x, z.y, '#fff', 30);
                        for(let j=0; j<2; j++) spawnZombieManual('runner', z.x + (Math.random()-0.5)*100, z.y + (Math.random()-0.5)*100);
                        for(let j=0; j<2; j++) spawnZombieManual('tank', z.x + (Math.random()-0.5)*100, z.y + (Math.random()-0.5)*100);
                    }

                    if (z.type === 'boss') {
                        z.moveTimer -= dt;
                        if (z.moveTimer <= 0) {
                            if (z.state === 'idle') {
                                z.state = 'telegraph'; z.moveTimer = 0.8; z.nextMove = Math.random() < 0.5 ? 'charge' : 'slam';
                            } else if (z.state === 'telegraph') {
                                z.state = z.nextMove; z.moveTimer = 0.6;
                                if(z.state==='charge') { const a = Math.atan2(player.y - z.y, player.x - z.x); z.md = {x:Math.cos(a), y:Math.sin(a)}; playSound(200,'sawtooth',0.5,0.1); }
                                if(z.state==='slam') { playSound(80,'sine',0.4,0.4); createParticles(z.x,z.y,'#fff',20); }
                            } else { z.state = 'idle'; z.moveTimer = 1.2; }
                        }
                        if (z.state === 'charge') { z.vx = z.md.x * z.speed * 6; z.vy = z.md.y * z.speed * 6; }
                        else if (z.state === 'idle') {
                            let dist = Math.hypot(player.x - z.x, player.y - z.y);
                            z.vx = ((player.x - z.x) / dist) * z.speed; z.vy = ((player.y - z.y) / dist) * z.speed;
                        } else { z.vx = 0; z.vy = 0; }
                    } else {
                        let dist = Math.hypot(player.x - z.x, player.y - z.y);
                        if (dist > 0) { z.vx = ((player.x - z.x) / dist) * z.speed; z.vy = ((player.y - z.y) / dist) * z.speed; }
                    }

                    z.x += z.vx * dt; z.y += z.vy * dt;

                    let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
                    if (distToPlayer < z.radius + player.r) {
                        player.hp -= (z.type === 'boss' ? 50 : 30) * dt; 
                        updateHUD(); 
                        if (player.hp <= 0) gameOver();
                    }

                    for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                        let b = bullets[bIndex];
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 5) {
                            z.hp -= b.damage; bullets.splice(bIndex, 1); createParticles(z.x, z.y, z.color, 2);
                            if (z.hp <= 0) {
                                playSound(100, 'sine', 0.3, 0.3);
                                createParticles(z.x, z.y, '#c62828', z.type === 'boss' ? 100 : 10);
                                score += (z.type === 'boss' ? 500 : 10);
                                spawnLoot(z.x, z.y, z.type === 'boss');
                                if (z.type === 'boss') bossUI.classList.add('hidden');
                                zombies.splice(i, 1); 
                                updateHUD();
                            }
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx * dt; particles[i].y += particles[i].vy * dt;
                particles[i].life -= dt * 2.5; if (particles[i].life <= 0) particles.splice(i, 1);
            }

            syncNetwork();
        }

        function spawnZombie(isBoss=false) {
            let x, y, ang=Math.random()*6.28;
            x = player.x + Math.cos(ang)*600; y = player.y + Math.sin(ang)*600;
            if(isBoss) {
                zombies.push({x,y,radius:55,speed:65,hp:100+wave*60,maxHp:100+wave*60,color:'#4a148c',type:'boss',state:'idle',moveTimer:1.5});
            } else {
                let type = wave>3 && Math.random()<0.2 ? 'runner' : (wave>5 && Math.random()<0.3 ? 'tank' : 'normal');
                spawnZombieManual(type, x, y);
            }
        }
        function spawnZombieManual(type, x, y) {
            let speed=50+Math.random()*50+(wave*5), hp=2+Math.floor(wave/2), r=15, col='#558b2f';
            if (type === 'runner') { speed*=1.8; hp=1; r=12; col='#7cb342'; }
            else if (type === 'tank') { speed*=0.5; hp*=4; r=25; col='#1b5e20'; }
            zombies.push({x,y,radius:r,speed,hp,maxHp:hp,color:col,type,vx:0,vy:0});
        }
        function createParticles(x,y,col,c){ for(let i=0;i<c;i++) particles.push({x,y,vx:(Math.random()-0.5)*350,vy:(Math.random()-0.5)*350,life:1.2,color:col,size:Math.random()*5+2}); }
        function spawnLoot(x,y,isBoss){ loot.push({x,y,type:'coin',val:5,label:'$',color:'gold',radius:12,life:30,bobOffset:0}); }

        function draw() {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#2a2a2a'; ctx.beginPath();
            for(let i=0; i<canvas.width; i+=100) { ctx.moveTo(i-(camera.x%100),0); ctx.lineTo(i-(camera.x%100),canvas.height); }
            for(let i=0; i<canvas.height; i+=100) { ctx.moveTo(0,i-(camera.y%100)); ctx.lineTo(canvas.width,i-(camera.y%100)); }
            ctx.stroke();

            Object.values(networkPlayers).forEach(p => {
                if(p.id === user.uid) return;
                drawPlayer(ctx, p.x-camera.x, p.y-camera.y, 15, p.angle || 0, p.skin || 'rookie');
                ctx.fillStyle='white'; ctx.fillText("P2", p.x-camera.x-5, p.y-camera.y-25);
            });

            for (let l of loot) {
                const bob = Math.sin(performance.now()/200 + l.bobOffset)*4;
                ctx.fillStyle = l.color; ctx.beginPath(); ctx.arc(l.x-camera.x, l.y-camera.y+bob, l.radius, 0, Math.PI*2); ctx.fill();
            }
            for (let p of particles) { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x-camera.x, p.y-camera.y, p.size, p.size); } ctx.globalAlpha = 1.0;
            for (let b of bullets) { ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(b.x-camera.x, b.y-camera.y, 4, 0, Math.PI*2); ctx.fill(); }
            for (let z of zombies) {
                ctx.fillStyle = z.color; ctx.beginPath(); ctx.arc(z.x-camera.x, z.y-camera.y, z.radius, 0, Math.PI*2); ctx.fill();
            }

            let ang = Math.atan2(mouse.y+camera.y-player.y, mouse.x+camera.x-player.x);
            drawPlayer(ctx, player.x-camera.x, player.y-camera.y, player.r, ang, player.skin);
        }

        function drawPlayer(c,x,y,r,ang,skinId) {
            c.save(); c.translate(x,y); c.rotate(ang);
            c.fillStyle = SKINS.find(s=>s.id===skinId)?.color || '#3498db';
            c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
            c.strokeStyle = '#111'; c.lineWidth = 6; c.beginPath(); c.moveTo(r*0.5,0); c.lineTo(r+10,0); c.stroke();
            c.restore();
        }

        function gameLoop(t) {
            if(!gameRunning) return;
            const dt = (t-lastTime)/1000; lastTime=t;
            update(dt); draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('earnedCoins').innerText = coinsCollectedInRun;
            saveData();
            window.showScreen('game-over-screen');
        }

        window.addEventListener('keydown', e => { const k=e.key.toLowerCase(); if(k==='w') keys.w=true; if(k==='a') keys.a=true; if(k==='s') keys.s=true; if(k==='d') keys.d=true; });
        window.addEventListener('keyup', e => { const k=e.key.toLowerCase(); if(k==='w') keys.w=false; if(k==='a') keys.a=false; if(k==='s') keys.s=false; if(k==='d') keys.d=false; });
        window.addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; });
        window.addEventListener('mousedown', () => mouse.down=true);
        window.addEventListener('mouseup', () => mouse.down=false);

        function updateUI() {
            document.getElementById('menuCoinDisplay').innerText = gameData.coins;
            document.getElementById('shopCoinDisplay').innerText = gameData.coins;
            renderShop();
        }
        
        function renderShop() {
            const grid = document.getElementById('shopGrid'); grid.innerHTML = '';
            SHOP_ITEMS.forEach(item => {
                const div = document.createElement('div'); div.className = 'shop-item';
                const isWeapon = item.type === 'weapon';
                const alreadyOwned = isWeapon && gameData.inventory.includes(item.weaponId);
                
                div.innerHTML = `<h3>${item.name}</h3>
                    <p class="cost">${alreadyOwned ? 'OWNED' : item.cost + ' COINS'}</p>
                    <button class="buy-btn" ${alreadyOwned || gameData.coins < item.cost ? 'disabled' : ''} onclick="buyItem('${item.id}')">
                        ${alreadyOwned ? 'OWNED' : 'BUY'}
                    </button>`;
                grid.appendChild(div);
            });
        }

        window.buyItem = (itemId) => {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item || gameData.coins < item.cost) return;

            if (item.type === 'weapon') {
                if (!gameData.inventory.includes(item.weaponId)) {
                    gameData.coins -= item.cost;
                    gameData.inventory.push(item.weaponId);
                    playSound(1200, 'sine', 0.2, 0.1);
                }
            } else if (item.type === 'upgrade') {
                if (gameData.upgrades[item.upgradeKey] < item.maxLevel) {
                    gameData.coins -= item.cost;
                    gameData.upgrades[item.upgradeKey]++;
                    playSound(1200, 'sine', 0.2, 0.1);
                }
            }
            saveData();
            updateSelectorUI();
        };
        
        function updateSelectorUI() {
            const skin = SKINS[selectedSkinIdx];
            document.getElementById('skinName').innerText = skin.name;
            const sCtx = document.getElementById('skinPreviewCanvas').getContext('2d');
            sCtx.clearRect(0,0,60,60); 
            sCtx.save(); sCtx.translate(30,30); sCtx.scale(1.5,1.5);
            drawPlayer(sCtx, 0,0, 15, 0, skin.id); 
            sCtx.restore();
            
            const list = gameData.inventory;
            if (selectedWeaponIdx >= list.length) selectedWeaponIdx = 0;
            const wId = list[selectedWeaponIdx];
            document.getElementById('weaponName').innerText = WEAPONS[wId].name;
        }

        document.getElementById('prevSkin').onclick = () => { selectedSkinIdx = (selectedSkinIdx - 1 + SKINS.length) % SKINS.length; updateSelectorUI(); playSound(500, 'sine', 0.05, 0.1); };
        document.getElementById('nextSkin').onclick = () => { selectedSkinIdx = (selectedSkinIdx + 1) % SKINS.length; updateSelectorUI(); playSound(500, 'sine', 0.05, 0.1); };
        document.getElementById('prevWeapon').onclick = () => { const list = gameData.inventory; selectedWeaponIdx = (selectedWeaponIdx - 1 + list.length) % list.length; updateSelectorUI(); playSound(500, 'sine', 0.05, 0.1); };
        document.getElementById('nextWeapon').onclick = () => { const list = gameData.inventory; selectedWeaponIdx = (selectedWeaponIdx + 1) % list.length; updateSelectorUI(); playSound(500, 'sine', 0.05, 0.1); };

        document.getElementById('closeShopBtn').onclick = () => window.showScreen('start-screen');
        document.getElementById('openShopBtn').onclick = () => { updateUI(); window.showScreen('shop-screen'); };
        document.getElementById('restartBtn').onclick = () => window.showScreen('start-screen');

        updateUI(); updateSelectorUI(); initAuth();

    </script>
</body>
</html>
